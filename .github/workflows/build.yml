name: Bauen und testen

on:
  push:
    branches: ['**', '!ci-results']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Legt einmalig den Signaturschlüssel an (verschlüsselt mit dem Secret KEYSTORE_PASSWORD) und committet ihn.
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref }}" }
      - name: Schlüssel anlegen, falls noch keiner da ist
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f android/keystore/release.jks.enc ]; then echo "Schlüssel vorhanden"; exit 0; fi
          if [ -z "$PW" ]; then echo "::error::KEYSTORE_PASSWORD fehlt – bitte unter Settings → Secrets → Actions anlegen"; exit 1; fi
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass:env PW -keypass:env PW -alias ratiobackup \
            -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=RatioBackup, O=ratioAI"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/release.jks" -out android/keystore/release.jks.enc -pass env:PW
          rm "$RUNNER_TEMP/release.jks"
          git config user.name "ci"; git config user.email "ci@ratiobackup.local"
          git add android/keystore/release.jks.enc
          git commit -m "chore: Signaturschlüssel angelegt [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  android:
    needs: keystore
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref }}" }
      - name: Schlüssel entschlüsseln
        env:
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "RB_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "RB_VERSION_NAME=0.${{ github.run_number }}" >> "$GITHUB_ENV"
          # Ohne Schlüssel (Secret fehlt) laufen Tests trotzdem; das Release-Job verlangt aber einen gültigen Schlüssel.
          [ -f android/keystore/release.jks.enc ] && [ -n "$PW" ] || { echo "kein Schlüssel – APK wird nur zum Testen signiert"; exit 0; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore/release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass env:PW
          echo "RB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests und Test-APK
        id: build
        working-directory: android
        env:
          RB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain 2>&1 | tee ../android.log
          cp app/build/outputs/apk/release/app-release.apk ../RatioBackup.apk
      - name: Zusammenfassung
        if: always()
        run: python3 tools/summarize.py android "${{ steps.build.outcome }}" android.log android/app/build/test-results > result-android.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: result-android, path: result-android.md }
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: apk, path: RatioBackup.apk }

  pc-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Tests
        id: build
        run: |
          set -o pipefail
          dotnet test pc/RatioBackup.Core.Tests/RatioBackup.Core.Tests.csproj --logger trx --results-directory pc-results 2>&1 | tee pc.log
      - name: Zusammenfassung
        if: always()
        run: python3 tools/summarize.py pc-test "${{ steps.build.outcome }}" pc.log pc-results > result-pc-test.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: result-pc-test, path: result-pc-test.md }

  pc-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: EXE bauen
        id: build
        shell: bash
        run: |
          set -o pipefail
          dotnet publish pc/RatioBackup.Tray/RatioBackup.Tray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=0.${{ github.run_number }}.0 -o out 2>&1 | tee exe.log
          cp out/RatioBackup-PC.exe RatioBackup-PC.exe
      - name: Zusammenfassung
        if: always()
        shell: bash
        run: python tools/summarize.py pc-exe "${{ steps.build.outcome }}" exe.log > result-pc-exe.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: result-pc-exe, path: result-pc-exe.md }
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: exe, path: RatioBackup-PC.exe }

  report:
    needs: [keystore, android, pc-test, pc-exe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: ${{ runner.temp }}/res
      - name: Ergebnis in Branch ci-results schreiben
        run: |
          R="${{ runner.temp }}/res"
          for j in android pc-test pc-exe; do [ -f "$R/result-$j.md" ] || echo "## $j: missing" > "$R/result-$j.md"; done
          { echo "# ${GITHUB_SHA} (${GITHUB_REF_NAME})"; cat "$R"/result-android.md "$R"/result-pc-test.md "$R"/result-pc-exe.md; } > "$R/all.md"
          git config user.name "ci"; git config user.email "ci@ratiobackup.local"
          if git ls-remote --exit-code origin ci-results >/dev/null; then
            git fetch -q --depth=1 origin ci-results && git checkout -q -B ci-results FETCH_HEAD
          else
            git checkout -q --orphan ci-results && git rm -rfq .
          fi
          mkdir -p results && cp "$R/all.md" "results/${GITHUB_SHA}.md" && cp "$R/all.md" latest.md
          git add results latest.md && git commit -qm "Ergebnis ${GITHUB_SHA}"
          for i in 1 2 3; do git push -q origin ci-results && break; git fetch -q --depth=1 origin ci-results && git rebase -q FETCH_HEAD; done

  release:
    needs: [keystore, android, pc-test, pc-exe]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      # Feste Download-Links:
      # https://github.com/ratioAI/ratioBackup/releases/latest/download/RatioBackup.apk
      # https://github.com/ratioAI/ratioBackup/releases/latest/download/RatioBackup-PC.exe
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(git log -1 --pretty=%s | python3 -c "import json,sys;print(json.dumps(sys.stdin.read().strip()))")
          echo "{\"versionCode\":$((100 + ${{ github.run_number }})),\"versionName\":\"0.${{ github.run_number }}\",\"notes\":$NOTES,\"apk\":\"RatioBackup.apk\",\"exe\":\"RatioBackup-PC.exe\"}" > dl/version.json
          cat dl/version.json
          gh release view test >/dev/null 2>&1 || gh release create test --title "RatioBackup Testversion" --notes "Automatisch gebaut aus dem aktuellen Stand von main."
          gh release upload test dl/RatioBackup.apk dl/RatioBackup-PC.exe dl/version.json --clobber
